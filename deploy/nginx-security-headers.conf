# Include this inside the HTTPS server block for www.myanmol.com.
# Do not add the HSTS preload token until the domain is deliberately submitted
# to the browser preload list. Preload is hard to undo.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Old Wix addresses. The React app also redirects these if nginx falls through to index.html.
location = /pms { return 301 /services/pms; }
location = /nri-1 { return 301 /solutions/nri; }
location = /nri-wealth-management { return 301 /solutions/nri; }
location = /portfolio-management-services-pms { return 301 /services/pms; }
